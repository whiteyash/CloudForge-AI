server:
  port: ${PORT:8000}

spring:
  application:
    name: cloudforge-api
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:cloudforgedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:${DATABASE_USER:sa}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:${DATABASE_PASSWORD:}}}
    hikari:
      initialization-fail-timeout: 3000
      connection-timeout: 5000
  data:
    redis:
      repositories:
        enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
  threads:
    virtual:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false
    mail:
      enabled: false

cloudforge:
  cors:
    allowed-origins: ${CLOUDFORGE_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${CLOUDFORGE_JWT_SECRET:c3VwZXItc2VjcmV0LWp3dC1rZXktY2xvdWRmb3JnZS1haS0zMi1ieXRlcyE=}
    access-token-ttl: PT15M
    refresh-token-ttl: P14D
