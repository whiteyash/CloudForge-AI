apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudforge-api
  namespace: cloudforge-system
  labels:
    app.kubernetes.io/name: cloudforge-api
    app.kubernetes.io/part-of: cloudforge-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudforge-api
  template:
    metadata:
      labels:
        app: cloudforge-api
    spec:
      containers:
        - name: api
          image: cloudforge/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: cloudforge-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudforge-web
  namespace: cloudforge-system
  labels:
    app.kubernetes.io/name: cloudforge-web
    app.kubernetes.io/part-of: cloudforge-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudforge-web
  template:
    metadata:
      labels:
        app: cloudforge-web
    spec:
      containers:
        - name: web
          image: cloudforge/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
