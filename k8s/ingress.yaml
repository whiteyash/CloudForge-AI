apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudforge-ingress
  namespace: cloudforge-system
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: cloudforge.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cloudforge-api-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudforge-web-service
                port:
                  number: 3000
